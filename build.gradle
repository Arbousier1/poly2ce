plugins {
    // 删掉 project. 前缀，直接引用变量名
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// 黑科技补丁：防止 1.21.11 映射解析崩溃
try {
    def loomClass = Class.forName("net.fabricmc.loom.LoomGradlePlugin")
    def gsonField = com.google.gson.Gson.class.getDeclaredField("prettyPrinting")
    gsonField.setAccessible(true)
    gsonField.setBoolean(loomClass.GSON, false)
} catch (Throwable e) { }

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.nucleoid.xyz/' } 
    maven { url 'https://libraries.minecraft.net/' } 
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    
    modImplementation include("eu.pb4:polymer-core:${project.polymer_version}")
    modImplementation include("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}