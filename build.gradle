plugins {
    // 读取 gradle.properties 中的 loom_version
    id 'fabric-loom' version "${project.loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Nucleoid 仓库 (Polymer)
    maven { url 'https://maven.nucleoid.xyz' }
    // Fabric 仓库
    maven { url 'https://maven.fabricmc.net/' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        // 注意：这里的 ID "polymer_converter" 必须与你的 fabric.mod.json 中的 "id" 保持一致
        // 即使你的 archives_base_name 是 "modid"，内部 ID 建议保持代码中定义的名称
        "polymer_converter" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Minecraft 版本 (读取 minecraft_version)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // 使用官方映射
    mappings loom.officialMojangMappings()
    
    // Fabric Loader (读取 loader_version)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (读取 fabric_version)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Polymer Core (读取 polymer_version)
    modImplementation include("eu.pb4:polymer-core:${project.polymer_version}")

    // Polymer Virtual Entity (读取 polymer_version)
    // 这是 EntityConverterLogic 必须的依赖
    modImplementation include("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
}

processResources {
    // 注入版本号到 fabric.mod.json
    inputs.property "version", project.mod_version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // 1.21+ 需要 Java 21
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}