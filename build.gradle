plugins {
    // 标准的 Fabric Loom 插件 ID 是 'fabric-loom'
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Nucleoid 仓库用于下载 Polymer
    maven { url 'https://maven.nucleoid.xyz' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        // [修改] 这里必须匹配你的 Mod ID，否则开发环境可能无法正确识别 Mixin 或资源
        "polymer_converter" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // [关键依赖] Polymer Core
    modImplementation include("eu.pb4:polymer-core:${project.polymer_version}")

    // [新增依赖] Polymer Virtual Entity
    // 我们的 EntityConverterLogic 用到了 ElementHolder，必须加这个才能编译！
    // 假设你的 gradle.properties 里 polymer_version 对这个库也适用
    modImplementation include("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}