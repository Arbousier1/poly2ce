plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // 修复：Gradle 8+ 建议使用 url = uri(...) 避免警告
    maven { url = uri('https://maven.nucleoid.xyz') } 
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "poly2ce" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Polymer Core
    modImplementation include("eu.pb4:polymer-core:${project.polymer_core_version}")
    
    // 修复：Virtual Entity 必须使用它自己的版本号，不能混用 core 的版本
    // 请确保你在 gradle.properties 里定义了 polymer_virtual_entity_version
    modImplementation include("eu.pb4:polymer-virtual-entity:${project.polymer_core_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName // 兼容性修复

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}