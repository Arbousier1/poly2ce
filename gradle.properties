# ====================================================
#  Gradle 运行优化 (解决卡顿与 OOM)
# ====================================================
# 必须提升至 4G，否则 1.21.11 的官方映射解析会直接内存溢出
org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled
# 开启并行构建，提升多模块或复杂依赖的编译速度
org.gradle.parallel=true
# 保持为 false，解决 Loom 与配置缓存的兼容性问题
org.gradle.configuration-cache=false
# 开启增量编译
org.gradle.caching=true

# ====================================================
#  Fabric 核心版本 (1.21.11 Java Edition)
# ====================================================
minecraft_version=1.21.11
# 如果 build.gradle 中切换为 Yarn 映射，请取消下方注释
# yarn_mappings=1.21.11+build.1
loader_version=0.18.4
loom_version=1.15-SNAPSHOT

# ====================================================
#  项目元数据
# ====================================================
mod_version=1.0.0
maven_group=top.ellan
# 建议与项目文件夹名称保持一致
archives_base_name=polymer-converter

# ====================================================
#  三方依赖版本
# ====================================================
# Fabric API 适配 1.21.11
fabric_api_version=0.141.2+1.21.11
# Polymer 核心及其扩展组件
polymer_version=0.15.1+1.21.11